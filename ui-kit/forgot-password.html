<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">

    <!-- Meta -->
    <meta name="description"
      content="Lightweight Bootstrap Admin Dashboards and Templates to power your marketplaces, SaaS platforms, and business applications." />
    <meta name="author" content="Bootstrap Get" />
    <link rel="canonical" href="https://www.bootstrapget.com" />

    <meta property="og:url" content="https://www.bootstrapget.com" />
    <meta property="og:title" content="Admin Dashboards & Bootstrap Templates for Marketplaces | Light Admin" />
    <meta property="og:description"
      content="Discover modern, lightweight Bootstrap admin dashboards and templates designed for marketplaces, SaaS, and web applications. Build faster with Light Admin." />

  <body class="login-bg">

    <!-- Form start -->
    <form action="index.html" class="my-5">
      <div class="auth-box border border-dark">
        <a href="index.html" class="mb-4 d-flex">
          <img src="assets/images/logo-dark.svg" class="img-fluid login-logo" alt="AdminPro Admin Dashboard" />
        </a>
        <h5 class="fw-light mb-5 lh-2">
          In order to access your account, please enter the email id you
          provided during the registration process.
        </h5>
        <div class="mb-3">
          <label class="form-label" for="email">Your Email <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="email" placeholder="Enter your email" />
        </div>
        <div class="d-grid py-2">
          <button type="submit" class="btn btn-lg btn-primary">
            Submit
          </button>
        </div>
      </div>
    </form>
    <!-- Form end -->
  </body>
