<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Gallery - Lavish Admin Dashboard Template</title>

    <!-- Meta -->
    <meta name="description"
      content="Lightweight Bootstrap Admin Dashboards and Templates to power your marketplaces, SaaS platforms, and business applications." />
    <meta name="author" content="Bootstrap Get" />
    <link rel="canonical" href="https://www.bootstrapget.com" />

    <meta property="og:url" content="https://www.bootstrapget.com" />
    <meta property="og:title" content="Admin Dashboards & Bootstrap Templates for Marketplaces | Light Admin" />
    <meta property="og:description"
      content="Discover modern, lightweight Bootstrap admin dashboards and templates designed for marketplaces, SaaS, and web applications. Build faster with Light Admin." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Light Admin Dashboard" />

    <link rel="shortcut icon" href="assets/images/favicon.svg">

    <!-- *************
			************ CSS Files *************
		************* -->
    <link rel="stylesheet" href="assets/fonts/bootstrap/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/main.min.css">
  </head>

  <body class="login-bg">

    <!-- Form start -->
    <form action="index.html" class="my-5">
      <div class="auth-box border border-dark">
        <a href="index.html" class="mb-4 d-flex">
          <img src="assets/images/logo-dark.svg" class="img-fluid login-logo" alt="AdminPro Admin Dashboard" />
        </a>
        <h4 class="my-4">Login</h4>
        <div class="mb-3">
          <label class="form-label" for="name">Your Email <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="name" autocomplete="autocomplete"
            placeholder="Enter your email" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="pwd">Your Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="pwd" placeholder="Enter password" />
        </div>
        <div class="d-flex align-items-center justify-content-between">
          <div class="form-check m-0">
            <input class="form-check-input" type="checkbox" value="" id="rememberPassword" />
            <label class="form-check-label" for="rememberPassword">Remember</label>
          </div>
          <a href="forgot-password.html" class="text-primary text-decoration-underline">Lost password?</a>
        </div>
        <div class="d-grid py-3 mt-3">
          <button type="submit" class="btn btn-lg btn-primary">
            LOGIN
          </button>
        </div>
        <div class="text-center py-2">or Login with</div>
        <div class="btn-group w-100">
          <button type="button" class="btn btn-sm btn-outline-dark">
            Facebook
          </button>
          <button type="button" class="btn btn-sm btn-outline-danger">
            Google
          </button>
          <button type="button" class="btn btn-sm btn-outline-dark">
            Twitter
          </button>
        </div>
        <div class="text-center pt-4">
          <span>Not registered?</span>
          <a href="signup.html" class="text-primary text-decoration-underline">
            SignUp</a>
        </div>
      </div>
    </form>
    <!-- Form end -->

  </body>
</html>
