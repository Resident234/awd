services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      DB_DSN: pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-yii_dev}
      DB_USERNAME: ${POSTGRES_USER:-yii}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    ports:
      - "127.0.0.1:8080:8080"
    command: ["php", "-S", "0.0.0.0:8080", "-t", "web", "web/index.php"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yii_dev}
      POSTGRES_USER: ${POSTGRES_USER:-yii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appnet

volumes:
  pgdata:
  composer-cache:

networks:
  appnet:
