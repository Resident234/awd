services:
  app:
    build:
      context: ./infra/php
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}
      DB_DSN: pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-yii_dev}
      DB_USERNAME: ${POSTGRES_USER:-yii}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      SELENIUM_URL: http://selenium:4444
      APP_URL: http://nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yii_dev}
      POSTGRES_USER: ${POSTGRES_USER:-yii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me-redis}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    networks:
      - backend

  memcached:
    image: memcached:1.6-alpine
    command: ["memcached", "--memory-limit=128", "--conn-limit=1024", "--threads=2"]
    expose:
      - "11211"
    networks:
      - backend

  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "127.0.0.1:4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - frontend

volumes:
  pgdata:
  redisdata:
  composer-cache:

networks:
  frontend:
  backend:
    internal: true
